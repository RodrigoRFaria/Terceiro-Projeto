<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Dev Club Jokenpo</title>
</head>

<body>
    <div class="container">
        <h1>JokenPo</h1>

        <div class="choices">
            <button id="rock" onclick="playHuman('rock')">&#x1F44A;</button>
            <button id="paper" onclick="playHuman('paper')">&#x1f590;</button>
            <button id="scissors" onclick="playHuman('scissors')">&#x270C;</button>
        </div>
       <p class="result"></p>

        <p class="score">Sua Pontuação: <span id="human-score">0</span></p>
        <p class="computer-score">Escolha do Computador: <span id="computer-score">0</span></p>
    </div>
    <script src="./scripts.js"></script>
</body>

</html>
